services:
  wire:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - SCRAPE_INTERVAL_HOURS=8
      # set in your shell or a .env file to enable /admin.html
      - ADMIN_TOKEN=${ADMIN_TOKEN:-}
      # set to a MongoDB connection string to store data there instead of SQLite
      - MONGODB_URI=${MONGODB_URI:-}
    volumes:
      - wire-data:/data

volumes:
  wire-data:
