name: Sync to Hugging Face Space

# Mirrors main to a Hugging Face Space (which then rebuilds and redeploys).
# Enable it by setting, under repo Settings → Secrets and variables → Actions:
#   - variable HF_SPACE  e.g. "youruser/intern-wire"
#   - secret   HF_TOKEN  a huggingface.co token with write access
# Does nothing until both exist. Note: data commits made by the scrape
# workflow's bot don't trigger this (GITHUB_TOKEN pushes never trigger
# workflows) — that's fine, the Space reads live data from MongoDB anyway.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    if: vars.HF_SPACE != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Push a snapshot to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          # HF rejects binary files in plain git, and main's history is full
          # of bot-committed internships.db versions — so never mirror
          # history. Ship one fresh commit with the database dropped: the
          # Space doesn't need it (Docker ignores *.db; data lives in Mongo).
          rm -f internships.db
          git checkout -q --orphan hf-deploy
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "deploy: snapshot of ${GITHUB_SHA::7}"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
